name: Release CI Gate

on:
  workflow_call:
    inputs:
      publish:
        type: boolean
        required: true

permissions:
  contents: read
  actions: read

jobs:
  verify:
    if: github.repository == 'YuanShiJiLoong/author'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
      - name: Require successful CI for this exact commit
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: node scripts/release-ci-gate.mjs
