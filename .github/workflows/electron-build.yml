# ============================================
#  自动构建 Electron 安装包并发布 Release
# ============================================
#  触发条件: 推送 v1.2.* 标签
# ============================================

name: Electron Build & Release

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

on:
  push:
    tags:
      - 'v1.2.*'
  workflow_dispatch:
    inputs:
      publish_release:
        description: Publish the verified installer to a GitHub release
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: electron-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/release-gate.yml
    with:
      publish: ${{ github.event_name == 'push' || inputs.publish_release }}
  build:
    needs: verify
    permissions:
      contents: write # Required by this job's final Create Release step.
    # 🔒 仅在原始仓库运行，防止 fork 利用 Secrets
    if: github.repository == 'YuanShiJiLoong/author'
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js
        run: npm run build

      - name: Build Electron installer
        run: npx electron-builder --win --publish never

      - name: Scan packaged Electron application before release
        run: npm run check:secrets:electron -- dist/win-unpacked

      - name: Generate release notes
        id: notes
        shell: bash
        run: |
          # 1. 尝试读取预热好的标题
          if [ -f "RELEASE_TITLE.txt" ]; then
            TITLE_DESC=$(cat RELEASE_TITLE.txt)
          else
            TITLE_DESC=$(git log -1 --pretty=format:"%s")
          fi
          
          # 清理由于多次撰写造成的冗余版号前缀，强制规范格式
          # 移除连续出现的 "Author v1.2.8 — ", "v1.2.8: ", "Author - " 等前缀
          export TITLE_DESC
          TITLE_DESC=$(node -e "
            let t = process.env.TITLE_DESC || '';
            t = t.replace(/^(?:\s*(?:Author|v?\d+\.\d+\.\d+)\s*(?:-|—|:|\s)\s*)+/ig, '').trim();
            console.log(t);
          ")
          
          echo "title_desc=$TITLE_DESC" >> $GITHUB_OUTPUT

          # 2. 尝试读取预热好的双语详细日记
          if [ -f "RELEASE_NOTES.md" ]; then
            cp RELEASE_NOTES.md RELEASE_BODY.md
          else
            # 兼容旧逻辑：回退到拉取 commits 列表
            PREV_TAG=$(git tag --sort=-creatordate | head -n 2 | tail -n 1)
            CURR_TAG=${GITHUB_REF#refs/tags/}
            
            if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$CURR_TAG" ]; then
              NOTES=$(git log --oneline -20 --pretty=format:"- %s")
            else
              NOTES=$(git log --oneline ${PREV_TAG}..${CURR_TAG} --pretty=format:"- %s")
            fi
            
            echo "## 📋 更新内容 / Changelog" > RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "### 🇨🇳 中文" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "$NOTES" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "📦 下载 \`.exe\` 安装包即可使用，云同步功能已内置。" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "---" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "### 🇺🇸 English" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "$NOTES" >> RELEASE_BODY.md
            echo "" >> RELEASE_BODY.md
            echo "📦 Download the \`.exe\` installer to get started. Cloud sync is built-in." >> RELEASE_BODY.md
          fi

      - name: Create Release
        if: github.event_name == 'push' || inputs.publish_release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          name: Author ${{ github.ref_name }} — ${{ steps.notes.outputs.title_desc }}
          body_path: RELEASE_BODY.md
          draft: false
          prerelease: false
          files: |
            dist/*.exe
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
