name: Multi-Arch Docker Build & Daily Sync

on:
  schedule:
    # 每天 UTC 03:00 (北京时间 11:00) 自动检查并同步上游官方最新代码
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      force_build:
        description: 'Force build Docker image even without sync'
        type: boolean
        default: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/author-app

jobs:
  sync-upstream:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      has_new_commits: ${{ steps.sync.outputs.has_new_commits }}
    steps:
      - name: Checkout Fork Repository
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Sync with Upstream
        id: sync
        run: |
          git remote add upstream https://github.com/YuanShiJiLoong/author.git || true
          git fetch upstream main
          BEFORE_SHA=$(git rev-parse HEAD)
          echo "Current SHA: $BEFORE_SHA"
          git merge upstream/main --ff-only || (git merge upstream/main -m "chore: auto sync upstream" || true)
          AFTER_SHA=$(git rev-parse HEAD)
          echo "Synced SHA: $AFTER_SHA"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            git push origin main
            echo "has_new_commits=true" >> $GITHUB_OUTPUT
          else
            echo "has_new_commits=false" >> $GITHUB_OUTPUT
          fi

  build-and-push:
    needs: sync-upstream
    if: |
      always() &&
      (needs.sync-upstream.outputs.has_new_commits == 'true' ||
       github.event_name == 'workflow_dispatch' ||
       github.event_name == 'push')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Lowercase repository name for image tag
        id: repo_name
        run: |
          echo "IMAGE_TAG=${REGISTRY}/$(echo '${{ env.IMAGE_NAME }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Extract App Version
        id: version
        run: |
          VERSION=$(node -p "require('./package.json').version")
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT

      - name: Build and Push Multi-Arch Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_TAG }}:latest
            ${{ env.IMAGE_TAG }}:v${{ steps.version.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
